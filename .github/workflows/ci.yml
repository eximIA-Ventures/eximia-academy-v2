name: CI

on:
  push:
    # `deploy/**` roda CI porque são essas branches que chegam a produção;
    # rodar só em `main` deixaria o artefato implantado sem gate algum.
    branches: [main, "deploy/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # As 4 verificações abaixo rodam de forma independente: sem o
      # `if: '!cancelled()'`, a primeira que falha marca as seguintes como
      # `skipped`, e um erro de formatação passa a esconder Typecheck, Test
      # e Build. Isso não afrouxa o gate — o job continua vermelho se
      # qualquer uma falhar; só garante que as 4 sempre reportem.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Unit Tests
        if: '!cancelled()'
        run: pnpm test

      - name: Build
        if: '!cancelled()'
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
